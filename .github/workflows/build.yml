
# Ele cria o projeto do launcher "Dash 360" e compila o APK sozinho.
name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Criar o projeto
        run: |
          mkdir -p app/src/main/java/com/dash360/launcher
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Dash360"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.dash360.launcher'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.dash360.launcher'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:label="Dash 360"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/dash360/launcher/MainActivity.java <<'EOF'
          package com.dash360.launcher;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.Drawable;
          import android.os.Bundle;
          import android.text.TextUtils;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.AbsListView;
          import android.widget.BaseAdapter;
          import android.widget.GridView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextClock;
          import android.widget.TextView;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          public class MainActivity extends Activity {

              // Cores dos azulejos (troque aqui se quiser)
              static final int[] CORES = {
                  0xFF107C10, 0xFF2B2B2B, 0xFF5DC21E, 0xFF1E1E1E, 0xFF0E6B0E, 0xFF3C3C3C
              };
              static final int COLUNAS = 3;

              static class App {
                  String nome, pacote, classe;
                  Drawable icone;
              }

              final List<App> apps = new ArrayList<>();
              GridView grade;
              BaseAdapter adaptador;

              int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density);
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(0xFF111111);
                  getWindow().setNavigationBarColor(0xFF111111);

                  LinearLayout raiz = new LinearLayout(this);
                  raiz.setOrientation(LinearLayout.VERTICAL);
                  raiz.setBackgroundColor(0xFF111111);
                  raiz.setPadding(dp(16), dp(12), dp(16), 0);

                  LinearLayout topo = new LinearLayout(this);
                  topo.setGravity(Gravity.CENTER_VERTICAL);
                  topo.setPadding(0, 0, 0, dp(12));

                  TextView titulo = new TextView(this);
                  titulo.setText("XBOX 360");
                  titulo.setTextColor(0xFF5DC21E);
                  titulo.setTextSize(28);
                  titulo.setTypeface(Typeface.DEFAULT_BOLD);
                  topo.addView(titulo, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  TextClock relogio = new TextClock(this);
                  relogio.setFormat24Hour("HH:mm");
                  relogio.setFormat12Hour("HH:mm");
                  relogio.setTextColor(Color.WHITE);
                  relogio.setTextSize(24);
                  topo.addView(relogio);
                  raiz.addView(topo);

                  grade = new GridView(this);
                  grade.setNumColumns(COLUNAS);
                  grade.setHorizontalSpacing(dp(6));
                  grade.setVerticalSpacing(dp(6));
                  grade.setSelector(new ColorDrawable(Color.TRANSPARENT));
                  grade.setVerticalScrollBarEnabled(false);
                  adaptador = new Adaptador();
                  grade.setAdapter(adaptador);
                  grade.setOnItemClickListener((pai, v, pos, id) -> abrir(apps.get(pos)));
                  raiz.addView(grade, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));

                  setContentView(raiz);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  carregar();
              }

              @Override
              public void onBackPressed() {
                  // launcher: nao fecha
              }

              void carregar() {
                  PackageManager pm = getPackageManager();
                  Intent i = new Intent(Intent.ACTION_MAIN);
                  i.addCategory(Intent.CATEGORY_LAUNCHER);
                  List<ResolveInfo> lista = pm.queryIntentActivities(i, 0);
                  apps.clear();
                  for (ResolveInfo r : lista) {
                      if (r.activityInfo.packageName.equals(getPackageName())) continue;
                      App a = new App();
                      a.nome = String.valueOf(r.loadLabel(pm));
                      a.pacote = r.activityInfo.packageName;
                      a.classe = r.activityInfo.name;
                      a.icone = r.loadIcon(pm);
                      apps.add(a);
                  }
                  Collections.sort(apps, (x, y) -> x.nome.compareToIgnoreCase(y.nome));
                  adaptador.notifyDataSetChanged();
              }

              void abrir(App a) {
                  Intent it = new Intent(Intent.ACTION_MAIN);
                  it.addCategory(Intent.CATEGORY_LAUNCHER);
                  it.setClassName(a.pacote, a.classe);
                  it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                  try {
                      startActivity(it);
                  } catch (Exception e) {
                      // app removido ou indisponivel
                  }
              }

              class Adaptador extends BaseAdapter {
                  public int getCount() { return apps.size(); }
                  public Object getItem(int i) { return apps.get(i); }
                  public long getItemId(int i) { return i; }

                  public View getView(int i, View conv, ViewGroup pai) {
                      App a = apps.get(i);
                      int lado = (getResources().getDisplayMetrics().widthPixels - dp(32) - dp(6) * (COLUNAS - 1)) / COLUNAS;

                      LinearLayout t = new LinearLayout(MainActivity.this);
                      t.setOrientation(LinearLayout.VERTICAL);
                      t.setGravity(Gravity.CENTER);
                      t.setPadding(dp(6), dp(6), dp(6), dp(6));
                      t.setBackgroundColor(CORES[i % CORES.length]);
                      t.setLayoutParams(new AbsListView.LayoutParams(lado, lado));

                      ImageView ic = new ImageView(MainActivity.this);
                      ic.setImageDrawable(a.icone);
                      t.addView(ic, new LinearLayout.LayoutParams(dp(48), dp(48)));

                      TextView nome = new TextView(MainActivity.this);
                      nome.setText(a.nome);
                      nome.setTextColor(Color.WHITE);
                      nome.setTextSize(12);
                      nome.setGravity(Gravity.CENTER);
                      nome.setSingleLine(true);
                      nome.setEllipsize(TextUtils.TruncateAt.END);
                      t.addView(nome, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                      return t;
                  }
              }
          }
          EOF
      - name: Preparar SDK do Android
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
      - name: Compilar o APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Dash360-APK
          path: app/build/outputs/apk/debug/app-debug.apk
